name: TF test

on:
  pull_request:
      types:
          - opened
          - synchronize
          - closed

  workflow_dispatch:

permissions:
  id-token: write # This is required for requesting the JWT for AWS role assumption
  contents: read  # This is required for actions/checkout

jobs:
  terraform_plan:
    if: github.ref != 'refs/heads/main'
    strategy:
      matrix:
        myenvironment: ["nonprod","production"]
    runs-on: ubuntu-latest
    environment: ${{ matrix.myenvironment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: role
        run: |
          pwd
          ls ./.github/actions/tfplan
      - name: tf_plan
        uses: ./.github/actions/tfplan
        with:
          test: ${{ env.TEST }}
          environment: ${{matrix.myenvironment}}

          
